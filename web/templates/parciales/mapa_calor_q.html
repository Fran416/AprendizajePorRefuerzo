<div class="chart-container">
    <h2>Tabla Q (Valores Estado-Acción)</h2>
    <div id="q-heatmap" class="chart-area"></div>
</div>

<script>
    (function() {
        const qData = {{ q_table | tojson }};
        const hist = {{ historial | tojson }};
        const eps = {{ epsilon }};

        // Heatmap con los valores Q para cada estado y acción
        const heatmapTrace = {
            z: qData,
            x: ['Normal (0)', 'Anómalo (1)'],
            y: Array.from({length: qData.length}, (_, i) => 'Estado ' + i),
            type: 'heatmap',
            colorscale: [
                [0, '#1a1a1a'],
                [0.5, '#3a5a7a'],
                [1, '#5a7d9a']
            ],
            hovertemplate: 'Estado: %{y}<br>Acción: %{x}<br>Q: %{z:.4f}<extra></extra>'
        };

        Plotly.newPlot('q-heatmap', [heatmapTrace], {
            title: { text: 'Valores Q Aprendidos', font: { color: '#cccccc' } },
            xaxis: { title: 'Acción', color: '#888888', gridcolor: '#333333' },
            yaxis: {
                title: 'Estado',
                color: '#888888',
                gridcolor: '#333333',
                showticklabels: false
            },
            paper_bgcolor: '#242424',
            plot_bgcolor: '#1a1a1a',
            font: { color: '#888888' },
            margin: { l: 40, r: 20, t: 40, b: 40 },
            height: 400
        }, { responsive: true });

        // Actualizar la curva de aprendizaje si hay datos
        const rewardCurve = document.getElementById('reward-curve');
        if (rewardCurve && hist && hist.length > 0) {
            Plotly.react('reward-curve', [{
                y: hist,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Recompensa por episodio',
                line: { color: '#5a7d9a' },
                marker: { color: '#5a7d9a', size: 4 }
            }], {
                title: { text: 'Recompensa Acumulada por Episodio', font: { color: '#cccccc' } },
                xaxis: { title: 'Episodio', color: '#888888', gridcolor: '#333333' },
                yaxis: { title: 'Recompensa', color: '#888888', gridcolor: '#333333' },
                paper_bgcolor: '#242424',
                plot_bgcolor: '#1a1a1a',
                font: { color: '#888888' },
                margin: { l: 50, r: 20, t: 40, b: 50 },
                height: 400
            }, { responsive: true });
        }

        // Actualizar el gauge de exploración
        const epsilonGauge = document.getElementById('epsilon-gauge');
        if (epsilonGauge) {
            Plotly.react('epsilon-gauge', [{
                type: 'indicator',
                mode: 'gauge+number',
                value: eps,
                number: { font: { color: '#cccccc', size: 28 }, suffix: '' },
                gauge: {
                    axis: { range: [0, 1], tickcolor: '#888888', tickfont: { color: '#888888' } },
                    bar: { color: '#5a7d9a' },
                    bgcolor: '#1a1a1a',
                    borderwidth: 1,
                    bordercolor: '#333333',
                    steps: [
                        { range: [0, 0.3], color: '#2a3a2a' },
                        { range: [0.3, 0.7], color: '#3a3a2a' },
                        { range: [0.7, 1], color: '#3a2a2a' }
                    ]
                }
            }], {
                title: { text: 'Tasa de Exploración (ε)', font: { color: '#cccccc' } },
                paper_bgcolor: '#242424',
                font: { color: '#888888' },
                height: 300
            }, { responsive: true });
        }
    })();
</script>
